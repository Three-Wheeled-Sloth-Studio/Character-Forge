version: 1
updated: 2026-09-08
identity:
  name: Character Forge
  repository_url: https://github.com/Three-Wheeled-Sloth-Studio/Character-Forge
  visibility: public
  production_branch: main
  acceptance_branch: qa
  development_branch: dev
  summary: Public modular character generation, maintenance, and cross-system translation engine for Parchment Worlds.
thesis:
  core_promise: Create and maintain system-native RPG characters while building an evidence-driven semantic bridge for translation, VTT integration, and future original-system design.
hard_requirements:
  - Preserve complete native system state for every character.
  - Never depend on the universal semantic projection to reconstruct retained native state.
  - Keep translation loss and approximation observable.
  - Build semantic abstractions incrementally from real system evidence.
  - Keep rules-system adapters isolated from shared character contracts.
  - Keep generation replayable where randomness or guided decision logic is involved.
  - Keep notes on translator and bridge-RPG implications as implementation teaches us.
first_system:
  id: dnd5e
  edition: "2024"
  initial_content_target: SRD 5.2.1
  current_slice: Mechanical SRD Level 1 breadth is automated-green on dev; owner accumulated runtime QA remains the promotion gate.
second_system:
  id: brp-uge
  name: Basic Roleplaying Universal Game Engine
  status: selected
  selected_date: 2026-09-08
  rules_boundary: 2023 Universal Game Engine under the ORC License, with the exact current errata boundary to be pinned by the first adapter implementation.
  rationale: Provides a strong contrast to D&D through percentile skills, profession-guided rather than class-bounded competence, open-ended skill specialties, modular optional rules and powers, use-driven advancement, and campaign-profile-dependent character construction.
  architecture_spike: refs/architecture/brp-second-system-premortem.md
  integration_boundary: refs/integration/brp-uge-orc.md
  tracking_issue: 13
  guardrail: Do not incorporate Call of Cthulhu-specific protected content without a separate license.
later_system_candidates:
  - forged-in-the-dark-family
  - fate-family
  - cypher-system
  - pathfinder-2e
  - traveller-family
  - gurps-family
bridge_rpg_hypotheses:
  resolution: Non-d20 with a bell-shaped distribution, likely centered on a 2d10 or 2d12 family.
  harm: Avoid generic hit-point attrition in favor of minor wounds plus occasional meaningful persistent serious wounds.
  setting_fit: Support broad genres while feeling native to psychic abilities, techno-magic, dark horror, cyberpunk, and steampunk aesthetics.
stack:
  confirmed:
    - TypeScript
    - Vitest
    - GitHub Actions
deployment:
  hosted_path: apps/character-forge/
  orchestrator_repository: Three-Wheeled-Sloth-Studio/Parchment-Worlds
  source_validation_workflow: .github/workflows/verify.yml
  policy: Deploy only an exact source SHA with successful verification; keep deployment credentials out of this public repository.
repository_layout:
  current_source_roots:
    - packages/character-model
    - packages/system-dnd5e
  planned_source_roots:
    - packages/system-brp
    - packages/generator-core
    - packages/semantic-model
    - packages/translator
    - packages/foundry-adapter
    - apps/web
source_of_truth:
  planning: refs/planning
  architecture: refs/architecture
  product: refs/product
  integration: refs/integration
  handoffs: refs/handoffs
  testing: refs/testing
  okf_profile: refs/okfProfile.yaml
  okf_discovery_index: refs/index.md
known_open_questions:
  - What is the minimum BRP rules-profile snapshot required for self-contained native validation and reopen?
  - What is the minimum semantic vocabulary justified by D&D and BRP evidence without overfitting shared contracts to either system?
  - What should the standalone Character Forge web surface own versus the Parchment Worlds host?
  - Which Foundry integration boundary is safest across Foundry and system schema revisions?
  - How should imported native derived values be marked stale and recalculated during maintenance without losing the imported source state?
