version: 1
updated: 2026-09-11
areas:
  character-contract:
    guidance:
      - refs/architecture/character-architecture.md
      - refs/planning/universal-grammar-v0.1.md
    source_roots:
      - packages/character-model
    notes: Shared CharacterDocument and adapter-boundary work. Keep native system state authoritative. BRP profile provenance, player-core state, D&D/BRP dedicated-sheet projections, presentation media slots, and creator interactions fit without making Foundry or sheet representation canonical; Universal Grammar remains later and evidence-driven.
  character-sheet:
    guidance:
      - refs/architecture/adaptive-character-sheet-framework.md
      - refs/handoffs/currentHandoff.md
      - refs/product/creator-workspace.md
      - refs/planning/brp-player-usable-core.md
    source_roots:
      - packages/character-sheet
      - packages/system-brp/src/sheetProjection.ts
      - packages/system-dnd5e/src/sheetProjection.ts
      - apps/web/src/characterSheetControls.ts
      - apps/web/src/sheetPrintContract.test.ts
      - apps/web/src/main.ts
      - apps/web/sheet.css
      - apps/web/sheet-ui.css
    notes: >-
      The adaptive sheet framework has BRP and D&D system-owned projections and
      a hard screen/print artifact boundary. Player-facing sheets contain
      character information, portrait/token presentation slots, and only a tiny
      rules-source footer; Character Forge branding, generation provenance,
      creator controls, native-document inspection, and document-action chrome
      are not sheet content. main.ts maintains a dedicated character-print-root
      containing rendered sheet HTML only. Print CSS hides the full forge-shell
      and exposes only that print root. The logical model is exactly two pages
      for both current systems; real browser QA must still confirm physical page
      count and long-content overflow.
  generator-core:
    guidance:
      - refs/product/generation-methods.md
      - refs/product/random-table-companion.md
      - refs/product/structured-naming.md
    source_roots:
      - packages/generator-core
    notes: System-neutral seeded randomness, dice expressions, random-table evaluation, and minimal name-suggestion provider/provenance. BRP whole-character randomization consumes these deterministic primitives without moving BRP rules into generator-core.
  structured-naming:
    guidance:
      - refs/product/structured-naming.md
      - refs/integration/brp-uge-orc.md
      - refs/planning/brp-investigative-horror-profile.md
    source_roots:
      - packages/generator-core/src/nameSuggestion.ts
      - packages/system-dnd5e/src/nameGeneration.ts
      - apps/web/src/dndGuidedCreatorPanel.ts
    notes: name-suggestion/0.1 is proven with D&D. BRP setting-owned naming remains future content-package work; bounded BRP Randomize All convenience names are Character Forge generation content, not BRP rules content.
  random-table-companion:
    guidance:
      - refs/product/random-table-companion.md
    source_roots:
      - packages/generator-core/src/randomTable.ts
      - packages/system-brp/src/professionSuggestion.ts
      - packages/system-brp/src/scholarAcademicSuggestion.ts
    notes: Generic weighted evaluator plus BRP-owned consumers are proven. Results remain suggestions/provenance rather than direct native patches.
  dnd5e:
    guidance:
      - refs/handoffs/archive/dnd-guided-narrative-paused-2026-09-09.md
      - refs/product/generation-methods.md
      - refs/product/creator-workspace.md
      - refs/architecture/adaptive-character-sheet-framework.md
      - refs/architecture/translation-bridge-rpg-notes.md
    source_roots:
      - packages/system-dnd5e
      - packages/system-dnd5e/src/sheetProjection.ts
      - apps/web/src/choicePoolDirectVisibility.ts
    notes: >-
      D&D 5E 2024 SRD 5.2.1 Level 1 breadth is proven. D&D now projects native
      abilities/resources/saves/skills/equipment/features/spells into the shared
      character-sheet renderer. Starting-equipment A/B/C IDs remain internal
      generation/provenance choices. Guided Mechanical visible option labels use
      the source-owned equipment descriptions, and direct-choice reconciliation
      compares both IDs and labels so raw A/B/C labels cannot survive merely
      because their values are technically correct. Guided Narrative remains
      parked and must not resume by chronology.
  brp:
    guidance:
      - refs/handoffs/currentHandoff.md
      - refs/handoffs/next-dev-prompt.md
      - refs/product/creator-workspace.md
      - refs/architecture/adaptive-character-sheet-framework.md
      - refs/planning/brp-to-universal-grammar-path.md
      - refs/planning/brp-player-usable-core.md
      - refs/planning/brp-player-usability-gap-audit.md
      - refs/planning/brp-investigative-horror-profile.md
      - refs/handoffs/archive/brp-second-system-stress-test-complete-2026-09-09.md
      - refs/integration/brp-uge-orc.md
      - refs/architecture/translation-bridge-rpg-notes.md
    source_roots:
      - packages/system-brp
      - packages/system-brp/src/campaignProfile.ts
      - packages/system-brp/src/sheetProjection.ts
      - apps/web/src/brpCreatorRandomization.ts
    notes: >-
      BRP UGE 2023 ORC plus corrections 1.05. brp-character/0.1 and canonical
      adapter 0.7 remain stable. Issue #14 includes profession/skill breadth,
      equipment, finishing, allocation UX, adaptive two-page sheet, isolated
      browser print, full CharacterDocument JSON controls, the BRP campaign/rules
      profile seam, and legal whole-character Randomize All. Large profile/rules
      provenance blocks are not part of the sheet; current rules identity is a
      tiny footer only. Owner browser sheet/save/reopen/print acceptance still
      gates Issue #14.
  creator-web:
    guidance:
      - refs/product/creator-workspace.md
      - refs/product/generation-methods.md
      - refs/architecture/adaptive-character-sheet-framework.md
      - refs/planning/brp-player-usable-core.md
    source_roots:
      - apps/web/src
      - apps/web/src/brpCreatorRandomization.ts
      - apps/web/src/workspaceSplitter.ts
      - apps/web/src/characterSheetControls.ts
      - apps/web/src/choicePoolDirectVisibility.ts
      - apps/web/src/sheetPrintContract.test.ts
      - apps/web/sheet.css
      - apps/web/sheet-ui.css
    notes: >-
      Creator UI must keep controls contained, distinguish actions from data
      entry, and prefer compact familiar icons with title/ARIA text. Supported
      systems with sheet projections render the system-owned sheet as the result
      surface. The screen sheet toolbar is application chrome and never prints.
      A dedicated print root, not selective in-place hiding, is the authoritative
      print surface. Choice menus must preserve player-facing labels even when
      their internal IDs remain unchanged.
  foundry-integration:
    guidance:
      - refs/architecture/character-architecture.md
      - refs/architecture/adaptive-character-sheet-framework.md
      - refs/planning/roadmap.yaml
    source_roots:
      - packages/character-model
      - packages/system-dnd5e
    notes: >-
      Foundry remains planned, not implemented. Current CharacterDocument and D&D
      native state are sufficient source contracts for a bounded export-only
      proof. Future packages/foundry-adapter should map explicit versioned native
      state into target Foundry Actor/embedded Item schemas without making those
      schemas canonical. Direct push/sync and portrait/token asset transfer are
      later increments. Do not create Foundry-specific fields in native BRP/D&D
      state merely for integration convenience.
  fate-third-system:
    guidance:
      - refs/planning/brp-to-universal-grammar-path.md
      - refs/planning/fate-third-system-probe.md
      - refs/planning/universal-grammar-v0.1.md
      - refs/architecture/translation-bridge-rpg-notes.md
      - refs/architecture/adaptive-character-sheet-framework.md
    source_roots:
      - packages
      - apps/web/src
    notes: Planned only after BRP Investigative Horror. Fate Condensed remains the bounded architecture stress test before Universal Grammar v0.1 is frozen.
  project-memory:
    guidance:
      - AGENTS.md
      - refs/README.md
      - refs/handoffs/currentHandoff.md
      - refs/testing/validationCommands.yaml
    source_roots:
      - refs
    notes: Durable project truth, OKF discovery, re-entry tooling, and validation guidance.
