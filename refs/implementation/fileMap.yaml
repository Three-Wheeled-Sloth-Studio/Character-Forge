      - packages/system-brp/src/scholarAcademicSuggestion.test.ts
    notes: Generic weighted evaluator plus two BRP-owned consumers are proven. No universal suggestion schema or nested-table engine is justified yet. Guided Narrative does not use this engine merely because it also has deterministic random choices.
  dnd5e:
    guidance:
      - refs/product/generation-methods.md
      - refs/product/creator-workspace.md
      - refs/product/structured-naming.md
      - refs/architecture/translation-bridge-rpg-notes.md
    source_roots:
      - packages/system-dnd5e
    notes: D&D 5E 2024 SRD 5.2.1 native rules and Level 1 breadth are proven. Top-level Guided Mechanical, Guided Narrative, and Quick modes exist. guidedNarrative.ts owns the first three-question mapping contract, deterministic Choose-for-me resolution, a target of about 3 and hard maximum of 5 presented Narrative choices, narrowed Class/Background/Species candidate sets, in-branch override validation, provenance, and ordinary guided/native construction.
  brp:
    guidance:
      - refs/handoffs/next-dev-prompt.md
      - refs/architecture/brp-second-system-premortem.md
      - refs/integration/brp-uge-orc.md
      - refs/product/structured-naming.md
      - refs/architecture/translation-bridge-rpg-notes.md
    source_roots:
      - packages/system-brp
    notes: BRP UGE 2023 ORC plus corrections 1.05. Creator QA is owner-accepted; BRP owns profession and Scholar academic random-table consumers. Naming data remains setting/campaign/content-package owned. No BRP Guided Narrative contract exists yet.
  creator-web:
    guidance:
      - refs/handoffs/next-dev-prompt.md
      - refs/product/creator-workspace.md
      - refs/product/generation-methods.md
      - refs/product/structured-naming.md
    source_roots:
      - apps/web/src
    notes: Shared workspace owns rules-system routing and Randomize All orchestration. D&D dndCreatorPanel owns Guided Mechanical / Guided Narrative / Quick mode switching. dndNarrativeCreatorPanel renders system-owned questions, explicit Choose for me options, visible replay seed, and only the narrowed mapped Class/Background/Species candidates. To reach a choice outside the current branch, change an upstream Narrative answer. Next focus is a narrow continuation seam into the existing Guided Mechanical editor.
  project-memory:
    guidance:
      - AGENTS.md
      - refs/README.md
      - refs/handoffs/currentHandoff.md
      - refs/testing/validationCommands.yaml
    source_roots:
      - refs
    notes: Durable project truth, OKF discovery, re-entry tooling, and validation guidance.
