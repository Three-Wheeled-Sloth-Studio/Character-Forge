areas:
  character-contract:
    guidance:
      - refs/architecture/character-architecture.md
      - refs/planning/universal-grammar-v0.1.md
    source_roots:
      - packages/character-model
    notes: Shared CharacterDocument and adapter-boundary work. Keep native system state authoritative. BRP profile provenance, powers, player-core professions, equipment, finishing, adaptive sheet projection, and creator randomization fit without changing the shared character contract; Universal Grammar remains later and evidence-driven.
  character-sheet:
    guidance:
      - refs/architecture/adaptive-character-sheet-framework.md
      - refs/handoffs/currentHandoff.md
      - refs/planning/brp-player-usable-core.md
    source_roots:
      - packages/character-sheet
      - apps/web/src
      - apps/web/sheet.css
      - packages/system-brp/src/sheetProjection.ts
    notes: >-
      The BRP-first adaptive sheet proof is implemented. Authoritative native
      state projects through a BRP-owned sheet projection into shared
      presentation-only rendering. Browser print / Save as PDF and full
      CharacterDocument JSON export are the current output paths. Presentation
      roles remain layout vocabulary only and are not Universal Grammar. Owner
      browser sheet acceptance remains pending after creator QA blockers were
      repaired.
  generator-core:
    guidance:
      - refs/product/generation-methods.md
      - refs/product/random-table-companion.md
      - refs/product/structured-naming.md
    source_roots:
      - packages/generator-core
    notes: System-neutral seeded randomness, dice expressions, random-table evaluation, and minimal name-suggestion provider/provenance. BRP whole-character randomization consumes these deterministic primitives without moving BRP rules into generator-core.
  structured-naming:
    guidance:
      - refs/product/structured-naming.md
      - refs/integration/brp-uge-orc.md
      - refs/planning/brp-investigative-horror-profile.md
    source_roots:
      - packages/generator-core/src/nameSuggestion.ts
      - packages/system-dnd5e/src/nameGeneration.ts
      - apps/web/src/dndGuidedCreatorPanel.ts
    notes: name-suggestion/0.1 is proven with D&D. BRP setting-owned naming remains future content-package work; the bounded BRP Randomize All convenience name list is Character Forge generation content, not BRP rules content.
  random-table-companion:
    guidance:
      - refs/product/random-table-companion.md
    source_roots:
      - packages/generator-core/src/randomTable.ts
      - packages/system-brp/src/professionSuggestion.ts
      - packages/system-brp/src/scholarAcademicSuggestion.ts
    notes: Generic weighted evaluator plus BRP-owned consumers are proven. Results remain suggestions/provenance rather than direct native patches.
  dnd5e:
    guidance:
      - refs/handoffs/archive/dnd-guided-narrative-paused-2026-09-09.md
      - refs/product/generation-methods.md
      - refs/product/creator-workspace.md
      - refs/architecture/translation-bridge-rpg-notes.md
    source_roots:
      - packages/system-dnd5e
    notes: D&D 5E 2024 SRD 5.2.1 Level 1 breadth is proven. Guided Narrative remains parked. Do not resume it by chronology or pull a D&D adaptive-sheet retrofit into BRP closeout.
  brp:
    guidance:
      - refs/handoffs/currentHandoff.md
      - refs/handoffs/next-dev-prompt.md
      - refs/product/creator-workspace.md
      - refs/architecture/adaptive-character-sheet-framework.md
      - refs/planning/brp-to-universal-grammar-path.md
      - refs/planning/brp-player-usable-core.md
      - refs/planning/brp-player-usability-gap-audit.md
      - refs/planning/brp-investigative-horror-profile.md
      - refs/handoffs/archive/brp-second-system-stress-test-complete-2026-09-09.md
      - refs/integration/brp-uge-orc.md
      - refs/architecture/translation-bridge-rpg-notes.md
    source_roots:
      - packages/system-brp
      - packages/system-brp/src/campaignProfile.ts
      - apps/web/src/brpCreatorRandomization.ts
    notes: >-
      BRP UGE 2023 ORC plus corrections 1.05. brp-character/0.1 and canonical
      adapter 0.7 remain stable. Issue #14 implementation includes
      profession/skill breadth, equipment, finishing, actionable allocation UX,
      adaptive two-page sheet rendering, browser print, full CharacterDocument
      JSON controls, the versioned BRP campaign/rules-profile seam, and a legal
      whole-character Randomize All interaction. Generic BRP Core is the only
      current active profile. Profile provenance is distinct from authoritative
      effective BrpRulesProfile state; reopen never re-resolves the current
      profile catalog. The first browser-QA creator blockers are remediated, but
      owner re-acceptance and deferred sheet/save/reopen/print QA still gate
      Issue #14 closeout.
  creator-web:
    guidance:
      - refs/product/creator-workspace.md
      - refs/product/generation-methods.md
      - refs/architecture/adaptive-character-sheet-framework.md
      - refs/planning/brp-player-usable-core.md
    source_roots:
      - apps/web/src
      - apps/web/src/brpCreatorRandomization.ts
      - apps/web/src/workspaceSplitter.ts
      - apps/web/sheet.css
    notes: >-
      Creator UI must keep controls contained within their pane, visually
      distinguish action buttons from form controls, prefer icon-first compact
      actions with tooltip/ARIA text, and use the bounded resizable splitter for
      the desktop creator/result workspace. BRP Randomize All now randomizes the
      supported player-facing identity/mechanical surface and fully spends legal
      skill budgets while preserving rules/profile and freeform context.
      UI/review/sheet/export/profile/randomization controls remain projections or
      interaction layers over native rules state. Next work is owner browser
      re-check followed by sheet/save/reopen/print acceptance, not new architecture.
  fate-third-system:
    guidance:
      - refs/planning/brp-to-universal-grammar-path.md
      - refs/planning/fate-third-system-probe.md
      - refs/planning/universal-grammar-v0.1.md
      - refs/architecture/translation-bridge-rpg-notes.md
      - refs/architecture/adaptive-character-sheet-framework.md
    source_roots:
      - packages
      - apps/web/src
    notes: Planned only after BRP Investigative Horror. Fate Condensed remains the bounded architecture stress test before Universal Grammar v0.1 is frozen.
  project-memory:
    guidance:
      - AGENTS.md
      - refs/README.md
      - refs/handoffs/currentHandoff.md
      - refs/testing/validationCommands.yaml
    source_roots:
      - refs
    notes: Durable project truth, OKF discovery, re-entry tooling, and validation guidance.
