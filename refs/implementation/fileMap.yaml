    guidance:
      - refs/handoffs/currentHandoff.md
      - refs/handoffs/next-dev-prompt.md
      - refs/architecture/brp-second-system-premortem.md
      - refs/integration/brp-uge-orc.md
      - refs/architecture/translation-bridge-rpg-notes.md
    source_roots:
      - packages/system-brp
    notes: BRP UGE 2023 ORC plus corrections 1.05. brp-character/0.1 supports the established skill/profile/profession/language creator backend plus the first backend-only Superpowers architecture proof. superpowers.ts owns the source-defined Normal/Heroic Superpowers budget, Extra Energy, Extra Hit Points, powered construction/provenance, and powered derived effects. poweredAdapter.ts exposes adapter 0.6.0 while delegating established non-power validation to the prior adapter. Skill-construction level and Superpowers power level are deliberately independent. No BRP Guided Narrative or universal capability contract exists.
  creator-web:
    guidance:
      - refs/product/creator-workspace.md
      - refs/product/generation-methods.md
      - refs/integration/brp-uge-orc.md
    source_roots:
      - apps/web/src
    notes: Existing D&D and BRP creator surfaces remain unchanged by the first Superpowers backend proof. Do not expose Powers UI until a user-facing power-system breadth is deliberately selected.
