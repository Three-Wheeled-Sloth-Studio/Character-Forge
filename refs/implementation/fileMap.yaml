      - refs/planning/brp-player-usability-gap-audit.md
      - refs/planning/brp-investigative-horror-profile.md
      - refs/handoffs/archive/brp-second-system-stress-test-complete-2026-09-09.md
      - refs/integration/brp-uge-orc.md
      - refs/architecture/translation-bridge-rpg-notes.md
    source_roots:
      - packages/system-brp
      - packages/system-brp/src/campaignProfile.ts
      - packages/system-brp/src/sheetProjection.ts
      - apps/web/src/brpCreatorRandomization.ts
    notes: >-
      BRP UGE 2023 ORC plus corrections 1.05. brp-character/0.1 and canonical
      adapter 0.7 remain stable. Issue #14 is completed and owner browser
      acceptance passed create, finish, review, save, reopen, and adaptive print.
      The player-facing core includes profession/skill breadth, equipment,
      finishing, allocation UX, campaign/rules profiles, full CharacterDocument
      JSON controls, and legal whole-character Randomize All. Issue #15 contains
      two nonblocking polish items and must not be pulled ahead implicitly.
  creator-web:
    guidance:
      - refs/product/creator-workspace.md
      - refs/product/generation-methods.md
      - refs/architecture/adaptive-character-sheet-framework.md
      - refs/planning/engineering-health-audit-2026-09-11.md
    source_roots:
      - apps/web/src
      - apps/web/src/characterResultRenderer.ts
      - apps/web/src/creatorPresentationAdapter.ts
      - apps/web/src/brpCreatorRandomization.ts
      - apps/web/src/workspaceSplitter.ts
      - apps/web/src/characterSheetControls.ts
      - apps/web/src/choicePoolDirectVisibility.ts
      - apps/web/src/sheetPrintContract.test.ts
      - apps/web/sheet.css
      - apps/web/sheet-ui.css
    notes: >-
      Stage 1 engineering-health work is active. main.ts is app bootstrap/host
      coordination rather than character-result rendering. characterResultRenderer.ts
      owns supported-system validation/routing and the sheet result surface.
      creatorWorkspace.ts coordinates rules systems and randomization without
      owning primary-UI cleanup. Remaining Stage 0 post-render minimalism is
      temporarily isolated in creatorPresentationAdapter.ts plus
      primaryUiMinimalism.ts and should be absorbed into source renderers next.
      Screen toolbar chrome never prints; isolated sheet-only printing remains the
      authoritative export path.
  foundry-integration:
    guidance:
      - refs/architecture/character-architecture.md
      - refs/architecture/adaptive-character-sheet-framework.md
      - refs/planning/roadmap.yaml
    source_roots:
      - packages/character-model
      - packages/system-dnd5e
    notes: >-
      Foundry remains planned, not implemented. Current CharacterDocument and D&D
      native state are sufficient source contracts for a bounded export-only
      proof. Future packages/foundry-adapter should map explicit versioned native
      state into target Foundry Actor/embedded Item schemas without making those
      schemas canonical. Direct push/sync and portrait/token asset transfer are
      later increments. Do not create Foundry-specific fields in native BRP/D&D
      state merely for integration convenience.
