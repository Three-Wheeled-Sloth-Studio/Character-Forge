version: 1
updated: 2026-09-10
areas:
  character-contract:
    guidance:
      - refs/architecture/character-architecture.md
      - refs/planning/universal-grammar-v0.1.md
    source_roots:
      - packages/character-model
    notes: Shared CharacterDocument and adapter-boundary work. Keep native system state authoritative. Superpowers, Psychic Abilities, player-core professions, bounded equipment, and descriptive finishing all fit without changing the shared contract; Universal Grammar remains a derived translation layer and is not frozen until D&D + BRP + Fate evidence is reviewed.
  character-sheet:
    guidance:
      - refs/architecture/adaptive-character-sheet-framework.md
      - refs/handoffs/currentHandoff.md
      - refs/planning/brp-player-usable-core.md
    source_roots:
      - apps/web/src
      - packages/system-brp
    notes: >-
      Accepted direction is a universal character-sheet framework, not a single
      universal sheet or rules model. Authoritative native state projects through
      a system-owned sheet projection into shared presentation/rendering code.
      The shared layer may own page geometry, typography, section/table primitives,
      overflow, print behavior, and accessibility; systems retain rules meaning,
      labels, grouping, and priority. BRP is the first proof. Presentation roles
      are layout vocabulary only and must not become Universal Grammar.
  generator-core:
    guidance:
      - refs/product/generation-methods.md
      - refs/product/random-table-companion.md
      - refs/product/structured-naming.md
    source_roots:
      - packages/generator-core
    notes: System-neutral seeded randomness, dice expressions, random-table evaluation, and minimal name-suggestion provider/provenance. BRP productization should reuse these seams only when a concrete player-facing need exists.
  structured-naming:
    guidance:
      - refs/product/structured-naming.md
      - refs/integration/brp-uge-orc.md
      - refs/planning/brp-investigative-horror-profile.md
    source_roots:
      - packages/generator-core/src/nameSuggestion.ts
      - packages/system-dnd5e/src/nameGeneration.ts
      - apps/web/src/dndGuidedCreatorPanel.ts
    notes: name-suggestion/0.1 is proven with D&D. BRP naming content remains setting/campaign/content-package owned; Investigative Horror does not justify inventing a BRP or CoC-derived name corpus.
  random-table-companion:
    guidance:
      - refs/product/random-table-companion.md
    source_roots:
      - packages/generator-core/src/randomTable.ts
      - packages/system-brp/src/professionSuggestion.ts
      - packages/system-brp/src/scholarAcademicSuggestion.ts
    notes: Generic weighted evaluator plus two BRP-owned consumers are proven. Add tables only for concrete product consumers; results remain suggestions/provenance rather than direct native patches.
  dnd5e:
    guidance:
      - refs/handoffs/archive/dnd-guided-narrative-paused-2026-09-09.md
      - refs/product/generation-methods.md
      - refs/product/creator-workspace.md
      - refs/architecture/translation-bridge-rpg-notes.md
    source_roots:
      - packages/system-dnd5e
    notes: D&D 5E 2024 SRD 5.2.1 Level 1 breadth is proven. Guided Narrative is explicitly parked after the Fighter Fighting Style branch; do not resume Cleric/Druid work from chronology alone. D&D may later validate the adaptive sheet renderer after the BRP-first proof, but do not pull that retrofit into the current BRP slice.
  brp:
    guidance:
      - refs/handoffs/currentHandoff.md
      - refs/handoffs/next-dev-prompt.md
      - refs/architecture/adaptive-character-sheet-framework.md
      - refs/planning/brp-to-universal-grammar-path.md
      - refs/planning/brp-player-usable-core.md
      - refs/planning/brp-player-usability-gap-audit.md
      - refs/planning/brp-investigative-horror-profile.md
      - refs/handoffs/archive/brp-second-system-stress-test-complete-2026-09-09.md
      - refs/architecture/brp-second-system-premortem.md
      - refs/integration/brp-uge-orc.md
      - refs/architecture/translation-bridge-rpg-notes.md
    source_roots:
      - packages/system-brp
    notes: >-
      BRP UGE 2023 ORC plus corrections 1.05. The second-system architecture
      stress test is complete and Issue #13 is closed. brp-character/0.1 and
      canonical adapter 0.7 remain stable. Issue #14 Player-Usable Core now has
      profession/skill breadth, equipment, identity/background finishing, and
      actionable allocation UX. The next bounded gap is the adaptive character-sheet
      framework proven first with a two-page BRP play/print projection, followed by
      the narrow campaign/rules-profile seam and owner browser QA. The accepted
      sequence after this epic remains BRP Investigative Horror, a bounded Fate
      Condensed probe, then Universal Grammar v0.1.
  creator-web:
    guidance:
      - refs/product/creator-workspace.md
      - refs/product/generation-methods.md
      - refs/architecture/adaptive-character-sheet-framework.md
      - refs/integration/brp-uge-orc.md
      - refs/planning/brp-player-usable-core.md
    source_roots:
      - apps/web/src
    notes: >-
      BRP productization now covers equipment/finishing and allocation guidance.
      Next establish a shared sheet presentation renderer plus BRP-owned projection.
      UI, review, sheet, and export remain projections; shared sheet code owns
      presentation mechanics only and BRP rules stay system-owned. Prefer browser
      print / Save as PDF and existing JSON export before adding PDF dependencies.
  fate-third-system:
    guidance:
      - refs/planning/brp-to-universal-grammar-path.md
      - refs/planning/fate-third-system-probe.md
      - refs/planning/universal-grammar-v0.1.md
      - refs/architecture/translation-bridge-rpg-notes.md
      - refs/architecture/adaptive-character-sheet-framework.md
    source_roots:
      - packages
      - apps/web/src
    notes: Planned only after BRP Investigative Horror. Fate Condensed is a bounded architecture probe selected to stress Aspects, Stunts, Stress, Consequences, narrative-mechanical state, and later the sheet-renderer assumptions before Universal Grammar v0.1 is frozen. Do not build a full Fate product by chronology.
  project-memory:
    guidance:
      - AGENTS.md
      - refs/README.md
      - refs/handoffs/currentHandoff.md
      - refs/testing/validationCommands.yaml
    source_roots:
      - refs
    notes: Durable project truth, OKF discovery, re-entry tooling, and validation guidance.
