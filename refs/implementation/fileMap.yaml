version: 1
updated: 2026-09-09
areas:
  character-contract:
    guidance:
      - refs/architecture/character-architecture.md
    source_roots:
      - packages/character-model
    notes: Shared CharacterDocument and adapter-boundary work. Keep native system state authoritative.
  generator-core:
    guidance:
      - refs/product/generation-methods.md
      - refs/product/random-table-companion.md
      - refs/product/structured-naming.md
    source_roots:
      - packages/generator-core
    notes: System-neutral seeded randomness, dice expressions, random-table evaluation, and the minimal name-suggestion provider/provenance contract. Core naming requires only displayName and opaque provider-owned context; it does not define identity semantics.
  structured-naming:
    guidance:
      - refs/product/structured-naming.md
      - refs/product/generation-methods.md
      - refs/integration/brp-uge-orc.md
    source_roots:
      - packages/generator-core/src/nameSuggestion.ts
      - packages/generator-core/src/nameSuggestion.test.ts
      - packages/system-dnd5e/src/nameGeneration.ts
      - packages/system-dnd5e/src/nameGeneration.test.ts
      - packages/system-dnd5e/src/guidedGenerate.ts
      - packages/system-dnd5e/src/guidedNameProvenance.test.ts
      - apps/web/src/dndGuidedCreatorPanel.ts
      - apps/web/src/creatorWorkspace.ts
    notes: name-suggestion/0.1 is proven with the existing D&D six-name placeholder provider and D&D guided creator provenance. BRP source discovery confirms naming content is setting/campaign/content-package owned rather than system-brp owned; no shared contract or generic content-provider layer change is justified until a concrete setting consumer exists.
  random-table-companion:
    guidance:
      - refs/product/random-table-companion.md
      - refs/product/generation-methods.md
    source_roots:
      - packages/generator-core/src/randomTable.ts
      - packages/generator-core/src/randomTable.test.ts
      - packages/system-brp/src/professionSuggestion.ts
      - packages/system-brp/src/professionSuggestion.test.ts
      - packages/system-brp/src/scholarAcademicSuggestion.ts
      - packages/system-brp/src/scholarAcademicSuggestion.test.ts
    notes: Generic weighted evaluator plus two BRP-owned consumers are proven. No universal suggestion schema or nested-table engine is justified yet.
  dnd5e:
    guidance:
      - refs/product/generation-methods.md
      - refs/product/structured-naming.md
      - refs/architecture/translation-bridge-rpg-notes.md
    source_roots:
      - packages/system-dnd5e
    notes: D&D 5E 2024 SRD 5.2.1 native rules, generation, validation, provenance, sticky acceptable-pool randomization, random ability generation, and structured generated-name provenance. The six-name corpus remains explicit Character Forge placeholder content and must not be scaled as SRD/culture data. Quick Generate top-level creator consolidation is the next concrete implementation slice.
  brp:
    guidance:
      - refs/handoffs/next-dev-prompt.md
      - refs/architecture/brp-second-system-premortem.md
      - refs/integration/brp-uge-orc.md
      - refs/product/structured-naming.md
      - refs/architecture/translation-bridge-rpg-notes.md
    source_roots:
      - packages/system-brp
    notes: BRP UGE 2023 ORC plus corrections 1.05. Creator QA is owner-accepted; BRP owns profession and Scholar academic random-table consumers. The ORC source makes names setting-dependent and supplies no generated-name corpus, so future BRP name generation must consume a concrete caller/setting provider rather than adding system-brp naming data.
  creator-web:
    guidance:
      - refs/handoffs/next-dev-prompt.md
      - refs/product/generation-methods.md
      - refs/product/structured-naming.md
    source_roots:
      - apps/web/src
    notes: Shared workspace owns Randomize All orchestration only. D&D-specific dndGuidedCreatorPanel retains complete name suggestions around the existing guided creator. Next implementation focus is consolidating existing D&D Quick Generate as a top-level creator mode without treating it as an ability method.
  project-memory:
    guidance:
      - AGENTS.md
      - refs/README.md
      - refs/handoffs/currentHandoff.md
      - refs/testing/validationCommands.yaml
    source_roots:
      - refs
    notes: Durable project truth, OKF discovery, re-entry tooling, and validation guidance.
