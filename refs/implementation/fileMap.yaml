      - packages/system-brp
    notes: >-
      BRP UGE 2023 ORC plus corrections 1.05. The second-system architecture
      stress test is complete and Issue #13 is closed. brp-character/0.1 and
      canonical adapter 0.7 support the established non-powered creator plus
      distinct Superpowers and Psychic grammars without shared-model changes.
      The active product line is Issue #14, BRP Player-Usable Core: run a bounded
      source-backed usability gap audit, then implement the highest-value missing
      vertical slice. The accepted sequence after that is BRP Investigative Horror,
      a bounded Fate Condensed third-system probe, then Universal Grammar v0.1.
      Do not auto-expand Powers or redesign proven native seams without product evidence.
