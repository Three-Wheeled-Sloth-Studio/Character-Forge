    source_roots:
      - packages/system-dnd5e
    notes: D&D 5E 2024 SRD 5.2.1 Level 1 breadth is proven. Guided Narrative is explicitly parked after the Fighter Fighting Style branch; do not resume Cleric/Druid work from chronology alone.
  brp:
    guidance:
      - refs/handoffs/currentHandoff.md
      - refs/handoffs/next-dev-prompt.md
      - refs/architecture/brp-second-system-premortem.md
      - refs/integration/brp-uge-orc.md
      - refs/architecture/translation-bridge-rpg-notes.md
    source_roots:
      - packages/system-brp
    notes: BRP UGE 2023 ORC plus corrections 1.05. brp-character/0.1 now proves two distinct backend-only power grammars without shared-model changes. superpowers.ts owns Normal/Heroic character-point purchasing for Extra Energy / Extra Hit Points. poweredAdapter.ts is the Superpowers-aware 0.6 layer. psychicAbilities.ts owns the bounded Normal Psychic creation grammar: two abilities, POW x1 bases, personal INT x10 reallocation, and Empathy/Mind Shield metadata. psychicAdapter.ts is canonical adapter 0.7 and validates Psychic plus combined personal-pool causality while delegating non-powered/Superpowers states. Skill-construction profile and power-system level remain deliberately independent. No universal capability contract exists.
  creator-web:
    guidance:
      - refs/product/creator-workspace.md
      - refs/product/generation-methods.md
      - refs/integration/brp-uge-orc.md
    source_roots:
      - apps/web/src
    notes: Existing D&D and BRP creator surfaces remain unchanged by the backend Powers architecture probes. Do not expose Powers UI until a deliberate user-facing power-system breadth is selected.
