version: 1
updated: 2026-09-03
commands:
  refs:
    command: npm run validate:refs
    purpose: Confirm required durable project-memory files and foundation guardrails, then validate the Agent Academy OKF profile and deterministic discovery indexes.
  okf:
    command: npm run validate:okf
    purpose: Validate OKF v0.2 concept frontmatter, the pinned Agent Academy profile, and deterministic discovery indexes.
  typecheck:
    command: npm run typecheck
    purpose: Type-check all TypeScript packages under strict settings.
  tests:
    command: npm test
    purpose: Run deterministic unit tests, including native-state preservation contracts.
  full:
    command: npm run verify
    purpose: Required milestone gate before a dev commit is considered ready for QA promotion.
ci:
  workflow: .github/workflows/verify.yml
  branches:
    - dev
    - qa
    - main
