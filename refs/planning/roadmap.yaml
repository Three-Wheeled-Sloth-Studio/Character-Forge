    guardrails:
      - Keep Call of Cthulhu-specific protected content out of the BRP adapter.
      - Preserve effective rules-profile and character-specific age context natively.
      - Profession is not class.
      - Preserve base chance, professional contribution, personal contribution, and final rating separately.
      - Keep specialties and language identities open-ended and source-owned.
      - Preserve both language subject identity and Own/Other role when source meaning depends on them.
      - Do not model future BRP powers through D&D spell-state structures.
      - Keep generation method provenance separate from runtime ontology unless a source proves otherwise.
      - Do not change shared CharacterDocument or semantic contracts without concrete cross-system evidence.

  - id: companion-random-tables
    horizon: now
    status: in_progress
    goal: Provide reusable provenance-bearing random-table evaluation for character flavor and structured suggestions without patching native character state directly.
    trigger:
      - D&D mechanical Level 1 breadth is automated-green.
      - Concrete consumers include traits, ideals, bonds, flaws, equipment/trinkets, tags/native IDs, weighted results, and subtable references.
    completed:
      - Discovery contract documented in refs/product/random-table-companion.md.
      - Generic evaluator implemented in generator-core rather than a system package.
      - Tables carry stable ID/version plus source ID/version and stable entry IDs.
      - Positive weighted entries default to weight 1 and may return arbitrary caller-owned typed payloads.
      - Evaluation is deterministic from evaluator/table/source versions plus caller seed and explicit drawIndex.
      - Returned provenance records evaluator version, table/source identity, seed, drawIndex, selected entry ID, selected weight, and total weight.
      - drawIndex makes partial replay independent of hidden global evaluation order.
      - Table validation rejects empty identity, duplicate entry IDs, empty tables, invalid weights, invalid random-source values, empty seeds, and invalid draw indexes.
      - Automated-green core checkpoint 0ace3aacc7e23a420377b6c4c8f2b9b243ec945e, Actions 34364243890, job 102508743773.
      - First system-owned consumer implemented in BRP as the source-safe Detective/Scholar profession suggestion table.
      - Creator suggestion, manual override, retained generation provenance, reopen behavior, and no-direct-native-patch boundary are proven.
      - Automated-green first-consumer checkpoint d4b881b29bd763d9f7fd50e56223b00b37077be2, Actions 34366600372, job 102516809719, 34 test files / 168 tests / 0 failures.
      - Second system-owned consumer implemented in BRP as a source-safe Scholar academic specialty suggestion table.
      - Nested system-owned result payloads are proven without nested table evaluation or shared suggestion ontology.
      - Independent per-slot suggestion provenance, re-suggest replacement, manual override, reopen validation, and no-direct-native-patch behavior are proven.
      - Automated-green second-consumer checkpoint 54d471faa5a635e46ab9db90f8d05d26ac32944f, Actions 34368120736, job 102522033597, 35 test files / 173 tests / 0 failures.
    current_slice:
      - Random-table core does not need expansion from current evidence.
      - Shared creator orchestration consumes the existing BRP Profession suggestion without requiring evaluator or table changes.
      - Keep a future D&D or third-system table consumer as useful cross-system evidence, but do not manufacture one solely to exercise the engine.
      - Do not force D&D Guided Narrative mapping through the random-table evaluator merely because both use deterministic randomness.
      - Do not promote a universal trait/ideal/bond/flaw vocabulary from the two BRP consumers.
      - Do not add nested-table support; nested structured results already work without it.
    guardrails:
      - Generic table engine remains system-neutral.
      - System datasets/mappings remain system-owned.
      - Results feed ordinary generation decisions or structured suggestions and retain seed/source/table provenance.
      - Add nesting only when a concrete consumer requires it.
      - Do not add roll-range authoring, uniqueness sampling, conditional graphs, or user-authored table persistence until evidence requires them.

  - id: naming-system-watch
    horizon: now
    status: in_progress
    goal: Replace temporary flat generated-name lists with structured, provenance-bearing naming informed by real system, culture, and language consumers.
    trigger:
      - D&D already has a temporary flat name generator that should not be scaled.
      - BRP owner QA exposed the absence of generated names.
      - Shared Randomize All now needs a clean system-owned name-randomizer participation seam.
      - D&D species, BRP human identity, and named BRP language support provide evidence that species, culture, language, and naming convention must remain separable.
    completed:
      - Structured naming contract documented in refs/product/structured-naming.md.
      - generator-core name-suggestion/0.1 requires only provider ID/version, optional source refs, seed, opaque provider-owned context, and a non-empty displayName result.
      - The shared contract deliberately does not define culture, language, species, gender, given/family-name parts, transliteration, or other identity ontology.
      - D&D adapts its existing six-name placeholder list through DND5E_PLACEHOLDER_NAME_PROVIDER without expanding content or changing explicit-seed selection behavior.
      - Direct user-entered names remain authoritative through the existing resolveDnd5eCharacterName compatibility path.
      - Automated-green naming contract/provider checkpoint 978e145bb4614cf6d0f4872cea61c9f9ede613bf, Actions 34372897196, job 102538304875, 39 test files / 188 tests / 0 failures.
      - D&D guided generation recipe 0.7 retains accepted generated-name provider/source/version/seed provenance in generation decisions while leaving displayName and native identity.name unchanged as ordinary strings.
      - Creator-local D&D name suggestions are retained only while current; manual input clears them, stale/tampered suggestions are rejected by replay validation, and generation-only application preserves native-state object identity.
      - Blank-name fallback retains its effective name replay seed, and reopen does not reconstruct or force a generated suggestion from display text.
      - Shared Randomize All continues to invoke the same D&D name button without shared naming semantics.
      - Automated-green D&D name-provenance checkpoint 1a1eb5de957eabd87b63785ef8dafccafbd47a44, Actions 34374497101, job 102543733892, 40 test files / 193 tests / 0 failures.
      - BRP ORC source review confirms that character names are setting/game dependent and optional cultural backgrounds are setting/GM-defined.
      - No BRP generated-name table, BRP-owned corpus, or culture-to-name mapping was found in the authoritative source boundary.
      - BRP naming data is setting/campaign/content-package owned; a future host may supply a concrete provider without changing name-suggestion/0.1.
      - No speculative generic content-provider layer is justified before a real Parchment/world/setting consumer exists.
    current_slice:
      - Naming architecture is waiting on a concrete setting/campaign/content consumer rather than further generic work.
      - Do not add a BRP name randomizer until such a provider and license/source boundary exist.
      - Keep name-suggestion/0.1 unchanged unless a real second provider demonstrates a gap.
      - Naming no longer blocks unrelated creator work; the D&D Guided Narrative class-defining-choice audit is the next active discovery slice.
    guardrails:
      - Do not scale by adding hundreds of flat full-name strings.
      - Retain deterministic/random provenance.
      - Keep system/setting/culture/language datasets separate from the reusable mechanism.
      - Do not equate species with culture, language, nationality, ethnicity, or naming convention.
      - Do not promote universal name-part fields until multiple real providers need the same semantics.

