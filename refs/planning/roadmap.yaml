version: 1
updated: 2026-09-09
principles:
  - Ship small vertical slices and revise architecture from evidence.
  - Keep native system state lossless even while the semantic bridge evolves.
  - Add universal concepts only when concrete system mappings justify them.
  - Make guided narrative generation a first-class path early.
  - Keep sticky user choice preferences separate from authoritative character state and per-character provenance.
  - Keep generation controls in the creator workspace and character details in a persistent adjacent review surface.
  - On desktop, long creator-control and character-review columns should scroll independently.
  - Shared creator randomization coordinates existing controls only; legal random semantics and distributions remain system-owned.
  - Random-table results feed ordinary generation decisions or structured suggestions; the generic evaluator never patches native state directly.
  - Naming mechanism, naming context, and name datasets must remain separable; species is not synonymous with culture or naming language.

