  - id: dnd5e-1-level-one-generation
    horizon: now
    status: in_progress
    goal: Deliver a usable D&D 5E 2024 SRD Level 1 generation path without losing native fidelity.
    completed:
      - WotC SRD 5.2.1 source/version/license boundary.
      - dnd5e-character/0.3 current native state with legacy reopen support.
      - Standard Array, Manual, Point Cost, Random, Quick, and guided generation converge on shared native construction.
      - Shared deterministic seeded-random and dice-expression generator core.
      - Creator workspace uses controls left/details right with independent scrolling and dynamic generation-method controls.
      - Sticky direct/random-from-acceptable choice pools implemented.
      - All 12 SRD classes, 4 backgrounds, and 9 species mechanically supported at Level 1.
      - 108 class/species matrix covered.
      - Nested class/background/species choices, species magic, class casting, Magic Initiate grants, Warlock Pact Magic/Invocations/Tome, Wizard spellbook, Druid/Ranger always-prepared source spells, equipment/training, and derived state retained natively.
      - Visible runtime build/source badge and Parchment local rebuild seam available for QA provenance.
      - Mechanical closeout checkpoint 55f79a1004c14eef1635e92c602e1fefa18cab15, Actions 34220401743, 25 test files / 117 tests, adapter 0.15.0.
      - Shared creator Randomize All delegates to existing D&D field randomizers and preserves checked sticky acceptable pools instead of duplicating random-choice rules.
      - When Random ability generation is already selected, Randomize All also invokes the existing D&D random-roll action.
      - Shared creator-randomization checkpoint 1f6ed5aee24f514fbc4fd9de39f9380e8df3719b, Actions 34369619403, job 102527165230, 36 test files / 178 tests / 0 failures.
      - D&D Random ability pre-roll assignment controls are hidden until rolls exist.
      - D&D 4d6 roll history is moved out of the cramped inline card surface into hover/accessibility detail.
      - D&D Random ability reassignment uses one-to-one swap semantics so all six rolled totals remain uniquely assigned.
      - Automated-green D&D Random-ability UX checkpoint e66003b9b6334218fb689d2da32ae5bf133251af, Actions 34371712699, job 102534309918, 37 test files / 181 tests / 0 failures.
      - The existing D&D six-name placeholder generator implements the shared name-suggestion provider seam without expanding its corpus or changing seeded selection behavior.
      - Placeholder naming data is explicitly identified as Character Forge content rather than SRD naming data.
      - Automated-green structured-naming proof checkpoint 978e145bb4614cf6d0f4872cea61c9f9ede613bf, Actions 34372897196, job 102538304875, 39 test files / 188 tests / 0 failures.
      - Guided D&D recipe 0.7 retains accepted generated-name provider/source/version/seed provenance as generation decisions while keeping displayName and native identity.name plain strings.
      - Blank-name fallback retains its effective name replay seed, manual name edits supersede stale suggestions, and creator-held suggestion application changes generation provenance without mutating native state.
      - D&D name randomization still participates in shared Randomize All through the existing name button; creatorWorkspace remains unaware of D&D naming rules.
      - Automated-green D&D generated-name provenance checkpoint 1a1eb5de957eabd87b63785ef8dafccafbd47a44, Actions 34374497101, job 102543733892, 40 test files / 193 tests / 0 failures.
    current_gate:
      - Mechanical SRD Level 1 breadth is complete on dev.
      - Accumulated owner runtime QA remains required before exact-SHA promotion.
      - Issue 11 tracks that gate.
    remaining_scope:
      - Owner runtime QA of representative classes/species and reopen behavior.
      - Owner browser QA the shared Randomize All behavior with restricted acceptable pools and dynamic dependent controls; fold findings into later touched creator slices rather than a dedicated cleanup cycle unless blocking.
      - Do not scale the temporary six-name placeholder corpus as if it were SRD, culture, language, or species naming data.
      - Consolidate Quick Generate as a top-level creator mode.
      - Add guided narrative generation through ordinary system APIs.
      - Keep the system-neutral random-table companion active as a parallel thread.
    tracking:
      guided_workspace_issue: 9
      core_choices_issue: 10
      full_srd_breadth_issue: 11
      workspace_qa_polish_issue: 12

  - id: system-6-second-stress-test
    horizon: now
    status: in_progress
    goal: Implement BRP Universal Game Engine as a structurally different second RPG and use evidence to break D&D-shaped assumptions before expanding shared semantics.
    selected_system: Basic Roleplaying Universal Game Engine
    rules_boundary: 2023 UGE ORC content with corrections 1.05
    tracking_issue: 13
    completed:
      - BRP selected over branded Call of Cthulhu as the public second-system implementation target.
      - Architecture premortem found no need to change character-document/0.1 or RulesSystemAdapter.
      - Source ID chaosium-brp-uge-orc-1.05 and ORC boundary recorded.
      - brp-character/0.1 introduced for a non-powered human profile.
      - Explicit STR/CON/SIZ/INT/POW/DEX/CHA with base/adjustment/final causality.
      - Deterministic standard-rolled 3d6 / 2d6+6 generation with seed, raw dice, and up-to-three-point redistribution provenance.
      - Core derived state and corrected Charisma Roll semantics.
      - Professional/personal skill contributions retained separately from source base and final rating.
      - Detective profession proves bounded professional electives without class semantics.
      - Normal and Heroic share one profile-aware builder/validator; Normal 250/75, Heroic 325/90, personal INT x 10.
      - Heroic default-starting-age causality retained with +20 professional points per full decade inside the current age boundary.
      - Scholar profession proves a second profession-choice grammar through five open Knowledge/Science specialties.
      - Repeated parent skills with distinct specialties accepted; exact parent+specialty duplicates rejected.
      - Scholar professional eligibility reconstructed independently from retained profession choices.
      - Named language identity closure retains open Own and Other language IDs/labels.
      - Language Own uses INT x 5 in the current EDU-disabled profile; Language Other uses 0 base.
      - Exact same language ID cannot occupy both Scholar Own and Other roles.
      - Personal allocation may learn additional named Language Other identities outside Scholar professional choices.
      - Adapter 0.5.0 independently validates language role/identity, source bases, exact professional eligibility, and tampering.
      - Scholar generation recipe 0.5 retains exact Own/Other language decisions and academic choices.
      - Native schema remains brp-character/0.1 across explicit/rolled, Normal/Heroic, Detective/Scholar, open specialty, and named-language slices.
      - Automated-green named-language checkpoint 1ce3387491ccf859f56d7a0e92217c7737a56bf0, Actions 34291613617, job 102279178820, 30 test files / 152 tests / 0 failures, 35 BRP tests.
      - First BRP creator UI landed in the existing creator workspace with D&D 5E 2024 preserved as the default system and the existing D&D guided creator left unchanged.
      - BRP creator exposes the supported Human profile only: Normal/Heroic, explicit/standard-rolled characteristics, Detective/Scholar, current age boundary, Average/Affluent wealth, open Scholar specialties/languages, and professional/personal contribution controls.
      - BRP creator preview and validity feedback use BRP-owned profession, generation, power-profile, skill, budget, builder, and adapter seams rather than browser-owned rules formulas.
      - BRP CharacterDocument reopen restores supported creator state from authoritative BRP native state, including generation provenance, rules profile, age causality, language identities, specialties, and contribution layers.
      - Automated-green first creator UI checkpoint b5cb07ab7c8873694e438bcc6e3ab799bfdf3c02, Actions 34295950302, job 102292513584, 32 test files / 159 tests / 0 failures.
      - Owner runtime/browser QA accepted the first BRP creator UI on 2026-09-09 with no blocking findings.
      - BRP owns the first concrete random-table consumer: a source-safe Detective/Scholar profession suggestion table using the generic evaluator and retained generation provenance.
      - BRP profession suggestion is creator-visible, manually overridable, replayable on reopen, and never patches authoritative native state directly.
      - BRP creator controls are constrained to the left generation column.
      - Automated-green profession-suggestion checkpoint d4b881b29bd763d9f7fd50e56223b00b37077be2, Actions 34366600372, job 102516809719, 34 test files / 168 tests / 0 failures.
      - BRP owns a second random-table consumer for Scholar academic specialties using source-safe Knowledge (Law) and Science (Forensics) definitions already present in the first-slice catalog.
      - Scholar academic suggestion returns a nested BRP-owned payload with skill key, Knowledge/Science parent, specialty identity, label, and source base chance.
      - Each of five Scholar academic slots may retain independent suggestion provenance; manual row edits clear that slot, and reopen restores only records still matching authoritative native state.
      - Automated-green Scholar academic-suggestion checkpoint 54d471faa5a635e46ab9db90f8d05d26ac32944f, Actions 34368120736, job 102522033597, 35 test files / 173 tests / 0 failures.
      - Shared Randomize All deliberately invokes only BRP Profession suggestion and Standard-Rolled characteristic re-roll where applicable.
      - Scholar academic suggestions remain field-level because the two-entry source-safe table cannot legally fill five unique required slots.
      - Age, Gender, Wealth, name, and similar fields remain unchanged because no deliberate BRP random distributions/generators exist yet.
      - Shared creator-randomization checkpoint 1f6ed5aee24f514fbc4fd9de39f9380e8df3719b, Actions 34369619403, job 102527165230, 36 test files / 178 tests / 0 failures.
      - The shared naming provider/provenance mechanism and D&D persistence pattern are now proven, but BRP still intentionally has no provider or corpus until a deliberate content/source ownership boundary is selected.
    current_gate:
      - The first BRP creator UI, both random-table consumers, and bounded Randomize All participation are accepted for continued dev work.
      - Owner browser QA of shared Randomize All remains useful but is not a dedicated implementation slice.
      - Naming work now needs a BRP provider/content ownership decision before implementation.
      - Keep accumulated BRP work on dev until an explicit exact-SHA promotion decision.
    remaining_scope:
      - Discover whether BRP naming content should be system-owned, setting/campaign-owned, or supplied by a shared content provider before implementing a BRP name randomizer.
      - Add BRP name generation only after selecting a deliberate BRP-appropriate provider/content source; do not borrow the D&D placeholder list or infer culture from Human species identity.
      - Add field-level randomizers for Age, Gender, Wealth only when their distributions are explicitly defined; do not invent them to satisfy Randomize All.
      - Keep Scholar academic suggestions field-level until source-safe content or another system-owned strategy can satisfy uniqueness legally.
      - Keep unsupported EDU, Sanity, Fatigue, hit locations, non-human rules, powers, age-50+, cultural/category modifiers, and broad profession ingestion out until separately prioritized.
    guardrails:
      - Keep Call of Cthulhu-specific protected content out of the BRP adapter.
      - Preserve effective rules-profile and character-specific age context natively.
      - Profession is not class.
      - Preserve base chance, professional contribution, personal contribution, and final rating separately.
      - Keep specialties and language identities open-ended and source-owned.
      - Preserve both language subject identity and Own/Other role when source meaning depends on them.
      - Do not model future BRP powers through D&D spell-state structures.
      - Keep generation method provenance separate from runtime ontology unless a source proves otherwise.
      - Do not change shared CharacterDocument or semantic contracts without concrete cross-system evidence.

  - id: companion-random-tables
    horizon: now
    status: in_progress
    goal: Provide reusable provenance-bearing random-table evaluation for character flavor and structured suggestions without patching native character state directly.
    trigger:
      - D&D mechanical Level 1 breadth is automated-green.
      - Concrete consumers include traits, ideals, bonds, flaws, equipment/trinkets, tags/native IDs, weighted results, and subtable references.
    completed:
      - Discovery contract documented in refs/product/random-table-companion.md.
      - Generic evaluator implemented in generator-core rather than a system package.
      - Tables carry stable ID/version plus source ID/version and stable entry IDs.
      - Positive weighted entries default to weight 1 and may return arbitrary caller-owned typed payloads.
      - Evaluation is deterministic from evaluator/table/source versions plus caller seed and explicit drawIndex.
      - Returned provenance records evaluator version, table/source identity, seed, drawIndex, selected entry ID, selected weight, and total weight.
      - drawIndex makes partial replay independent of hidden global evaluation order.
      - Table validation rejects empty identity, duplicate entry IDs, empty tables, invalid weights, invalid random-source values, empty seeds, and invalid draw indexes.
      - Automated-green core checkpoint 0ace3aacc7e23a420377b6c4c8f2b9b243ec945e, Actions 34364243890, job 102508743773.
      - First system-owned consumer implemented in BRP as the source-safe Detective/Scholar profession suggestion table.
      - Creator suggestion, manual override, retained generation provenance, reopen behavior, and no-direct-native-patch boundary are proven.
      - Automated-green first-consumer checkpoint d4b881b29bd763d9f7fd50e56223b00b37077be2, Actions 34366600372, job 102516809719, 34 test files / 168 tests / 0 failures.
      - Second system-owned consumer implemented in BRP as a source-safe Scholar academic specialty suggestion table.
      - Nested system-owned result payloads are proven without nested table evaluation or shared suggestion ontology.
      - Independent per-slot suggestion provenance, re-suggest replacement, manual override, reopen validation, and no-direct-native-patch behavior are proven.
      - Automated-green second-consumer checkpoint 54d471faa5a635e46ab9db90f8d05d26ac32944f, Actions 34368120736, job 102522033597, 35 test files / 173 tests / 0 failures.
    current_slice:
      - Random-table core does not need expansion from current evidence.
      - Shared creator orchestration consumes the existing BRP Profession suggestion without requiring evaluator or table changes.
      - Keep a future D&D or third-system table consumer as useful cross-system evidence, but do not manufacture one solely to exercise the engine.
      - Do not promote a universal trait/ideal/bond/flaw vocabulary from the two BRP consumers.
      - Do not add nested-table support; nested structured results already work without it.
    guardrails:
      - Generic table engine remains system-neutral.
      - System datasets/mappings remain system-owned.
      - Results feed ordinary generation decisions or structured suggestions and retain seed/source/table provenance.
      - Add nesting only when a concrete consumer requires it.
      - Do not add roll-range authoring, uniqueness sampling, conditional graphs, or user-authored table persistence until evidence requires them.

  - id: naming-system-watch
    horizon: now
    status: in_progress
    goal: Replace temporary flat generated-name lists with structured, provenance-bearing naming informed by real system, culture, and language consumers.
    trigger:
      - D&D already has a temporary flat name generator that should not be scaled.
      - BRP owner QA exposed the absence of generated names.
      - Shared Randomize All now needs a clean system-owned name-randomizer participation seam.
      - D&D species, BRP human identity, and named BRP language support provide evidence that species, culture, language, and naming convention must remain separable.
    completed:
      - Structured naming contract documented in refs/product/structured-naming.md.
      - generator-core name-suggestion/0.1 requires only provider ID/version, optional source refs, seed, opaque provider-owned context, and a non-empty displayName result.
      - The shared contract deliberately does not define culture, language, species, gender, given/family-name parts, transliteration, or other identity ontology.
      - D&D adapts its existing six-name placeholder list through DND5E_PLACEHOLDER_NAME_PROVIDER without expanding content or changing explicit-seed selection behavior.
      - Direct user-entered names remain authoritative through the existing resolveDnd5eCharacterName compatibility path.
      - Automated-green naming contract/provider checkpoint 978e145bb4614cf6d0f4872cea61c9f9ede613bf, Actions 34372897196, job 102538304875, 39 test files / 188 tests / 0 failures.
      - D&D guided generation recipe 0.7 retains accepted generated-name provider/source/version/seed provenance in generation decisions while leaving displayName and native identity.name unchanged as ordinary strings.
      - Creator-local D&D name suggestions are retained only while current; manual input clears them, stale/tampered suggestions are rejected by replay validation, and generation-only application preserves native-state object identity.
      - Blank-name fallback retains its effective name replay seed, and reopen does not reconstruct or force a generated suggestion from display text.
      - Shared Randomize All continues to invoke the same D&D name button without shared naming semantics.
      - Automated-green D&D name-provenance checkpoint 1a1eb5de957eabd87b63785ef8dafccafbd47a44, Actions 34374497101, job 102543733892, 40 test files / 193 tests / 0 failures.
    current_slice:
      - Discover the legitimate ownership and content boundary for a BRP name provider before adding BRP creator randomization.
      - Determine whether BRP itself has source-safe naming content or whether naming should instead be setting/campaign/provider-owned.
      - Do not infer culture or naming language from BRP's Human profile or reuse the D&D placeholder corpus.
      - Keep name-suggestion/0.1 unchanged unless a real second-provider requirement demonstrates a gap.
    guardrails:
      - Do not scale by adding hundreds of flat full-name strings.
      - Retain deterministic/random provenance.
      - Keep system/setting/culture/language datasets separate from the reusable mechanism.
      - Do not equate species with culture, language, nationality, ethnicity, or naming convention.
      - Do not promote universal name-part fields until multiple real providers need the same semantics.

