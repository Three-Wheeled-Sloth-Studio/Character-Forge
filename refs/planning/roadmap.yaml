version: 1
updated: 2026-08-26
principles:
  - Ship small vertical slices and revise architecture from evidence.
  - Keep native system state lossless even while the semantic bridge evolves.
  - Add universal concepts only when concrete system mappings justify them.
  - Make guided narrative generation a first-class path early.
  - Keep sticky user choice preferences separate from authoritative character state and per-character provenance.
  - Keep generation controls in the creator workspace and character details in a persistent adjacent review surface rather than multiplying full-width method panels.
roadmap:
  - id: foundation-0-repository-baseline
    horizon: completed
    status: completed
    goal: Establish development workflow, durable guidance, validation, and the minimum character contract.
    exit_criteria:
      - dev, qa, and main branches exist with exact-SHA promotion guidance.
      - CI verifies dev, qa, and main.
      - CharacterDocument requires retained native system state.
      - Tests prove native payload survives JSON round trip without requiring semantic projection.
      - Translator and bridge-RPG evidence ledger exists and is required agent reading.
    validation:
      local_windows_gate: green 2026-08-26
  - id: dnd5e-1-level-one-generation
    horizon: now
    status: in_progress
    goal: Deliver a usable D&D 5E 2024 SRD Level 1 character generation path and broaden it incrementally without losing native fidelity.
    completed:
      - Versioned rules-system adapter contract separated from D&D implementation.
      - SRD 5.2.1 source, version, creator, and CC-BY-4.0 license metadata.
      - Typed D&D-native character schema for the first slice.
      - Owner-accepted Human Soldier Fighter Quick Generate plus Parchment save/reopen seam.
      - Shared 2024 background adjustment and final-score behavior.
      - Standard Array, Manual Ability Entry, SRD Point Cost, and SRD Random Generation.
      - Reusable deterministic system-neutral seeded-random and dice-expression generator core.
      - Random 4d6 keep-highest-3 generation retaining raw dice, kept dice, roll slots, seed, and assignment provenance.
      - All twelve SRD 5.2.1 classes cataloged with primary-ability/support metadata.
      - All nine SRD 5.2.1 species cataloged with support/blocking metadata.
      - All four SRD backgrounds cataloged with ability/feat/skill/tool/support metadata.
      - Reusable sticky acceptable-option choice-pool behavior with direct or random-from-checked selection.
      - Guided class-first creation using sticky Class, Background, and Species pools.
      - Guided Level 1 native support for Barbarian, Fighter, Monk, and Rogue.
      - Guided background support for Criminal and Soldier, including real ability eligibility, Origin feat, skills, tool, equipment package or 50 GP, and derived-state effects.
      - Acolyte and Sage cataloged but blocked until Magic Initiate spell choices/native spell state are explicit.
      - Guided species support for Dwarf, Halfling, Human, and Orc.
      - Generalized dnd5e-character/0.2 guided native state while preserving dnd5e-character/0.1 validation/reopen.
      - Adapter 0.6.0 validates supported guided class/background/species native state and background-owned ability increases.
      - Standard Array, Point Cost, Random, and Manual routed through one guided native builder.
      - Creator workspace consolidated to generation controls on the left and character details on the right, with one dynamic ability-generation dropdown.
    current_gate:
      - Owner runtime QA for the accumulated generation stack remains intentionally deferred.
      - Current generation/guided work stays on dev and is not promoted until that combined pass is accepted.
    current_slice:
      - Open real class-owned choices for the four supported martial classes rather than keeping permanent fixture defaults.
      - Preserve the consolidated creator workspace and ordinary choice-pool/provenance boundaries.
    remaining_scope:
      - Open class skill, Fighting Style, Weapon Mastery, Expertise/tool and related martial choices incrementally.
      - Model nested species ancestry/lineage/legacy choices and then enable additional SRD species.
      - Add a faithful spell/native-state seam, then enable Acolyte/Sage and SRD spellcasting classes incrementally.
      - Consolidate Quick Generate into the creator workspace as a top-level creation mode, not an ability method.
      - Add early guided narrative generation through the same catalogs and ordinary generation APIs.
      - Introduce a system-neutral random-table companion only after concrete class/species/background consumers define its output contract and before guided narrative creates parallel table machinery.
  - id: companion-random-tables
    horizon: watch
    status: discovery_triggered_later
    goal: Provide reusable provenance-bearing random-table evaluation for character flavor and structured suggestions without patching native character state directly.
    trigger:
      - Backgrounds are open and at least one or two additional class/species choice slices provide concrete consumers.
      - The table output contract can be derived from real needs such as traits, ideals, bonds, flaws, equipment/trinkets, tags, native IDs, or subtable references.
      - Start before guided narrative grows large enough to invent separate randomization infrastructure.
    guardrails:
      - Generic table engine remains system-neutral.
      - D&D datasets and mappings remain D&D-owned.
      - Table results feed ordinary generation decisions or structured suggestions and retain provenance.
      - Do not freeze a universal table schema from D&D flavor tables alone.
  - id: parchment-2-character-persistence
    horizon: completed
    status: completed
    goal: Make generated CharacterDocuments first-class durable Parchment project assets before broadening generation further.
    completed:
      - Full CharacterDocument persisted losslessly without teaching Parchment D&D mechanics.
      - Explicit project ownership and stable Parchment character asset identity.
      - Project-level character inventory.
      - Browser reload durability.
      - Parchment -> Character Forge reopen preserving native state and generation provenance.
      - Owner runtime QA accepted on 2026-08-26.
      - Accepted checkpoints promoted to qa and main.
    tracking:
      parchment_issue: 24
      status: closed
  - id: foundry-3-dnd5e-integration
    horizon: near
    status: planned
    goal: Prove a Foundry D&D 5E adapter boundary without making Foundry Actor JSON the canonical Character Forge format.
  - id: maintenance-4-advancement
    horizon: near
    status: planned
    goal: Support advancement, durable edits, revision history, and system-native maintenance without losing provenance.
  - id: semantic-5-cross-system-language
    horizon: after-evidence
    status: planned
    goal: Promote observed cross-system concepts into a versioned semantic character language with explicit translation-loss reporting.
  - id: system-6-second-stress-test
    horizon: after-first-dnd-and-persistence-slices
    status: planned
    goal: Implement a structurally different second RPG to break D&D-shaped assumptions in the semantic layer.
    strongest_candidate: Call of Cthulhu
    decision_note: Re-evaluate the candidate using evidence collected during D&D, persistence, and Foundry work rather than locking the choice now.
  - id: system-7-pathfinder
    horizon: later
    status: planned
    goal: Add Pathfinder after the semantic layer has already been stressed by a less D&D-like system.
  - id: bridge-rpg-8-design-synthesis
    horizon: later
    status: planned
    goal: Use accumulated cross-system evidence to inform the original non-d20 RPG without making Character Forge depend on that system.
  - id: identity-9-hosted-maintenance
    horizon: later
    status: planned
    goal: Add hosted character pages, privacy, sharing, QR access, and synchronization through the Parchment ecosystem.
  - id: visuals-10-character-assets
    horizon: later
    status: planned
    goal: Add structured portrait, token, reference-sheet, and eventual 3D model generation pipelines.
