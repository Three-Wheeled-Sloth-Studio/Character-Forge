version: 1
updated: 2026-08-27
principles:
  - Ship small vertical slices and revise architecture from evidence.
  - Keep native system state lossless even while the semantic bridge evolves.
  - Add universal concepts only when concrete system mappings justify them.
  - Make guided narrative generation a first-class path early.
  - Keep sticky user choice preferences separate from authoritative character state and per-character provenance.
  - Keep generation controls in the creator workspace and character details in a persistent adjacent review surface rather than multiplying full-width method panels.
  - On desktop, long creator-control and character-review columns should scroll independently.
roadmap:
  - id: foundation-0-repository-baseline
    horizon: completed
    status: completed
    goal: Establish development workflow, durable guidance, validation, and the minimum character contract.
    exit_criteria:
      - dev, qa, and main branches exist with exact-SHA promotion guidance.
      - CI verifies dev, qa, and main.
      - CharacterDocument requires retained native system state.
      - Tests prove native payload survives JSON round trip without requiring semantic projection.
      - Translator and bridge-RPG evidence ledger exists and is required agent reading.
    validation:
      local_windows_gate: green 2026-08-26

  - id: dnd5e-1-level-one-generation
    horizon: now
    status: in_progress
    goal: Deliver a usable D&D 5E 2024 SRD Level 1 character generation path and broaden it to the public SRD catalog without losing native fidelity.
    completed:
      - Versioned rules-system adapter contract separated from D&D implementation.
      - SRD 5.2.1 source, version, creator, and CC-BY-4.0 license metadata.
      - Typed D&D-native character schemas with legacy reopen support.
      - Owner-accepted Human Soldier Fighter Quick Generate plus Parchment save/reopen seam.
      - Shared 2024 background adjustment and final-score behavior.
      - Standard Array, Manual Ability Entry, SRD Point Cost, and SRD Random Generation.
      - Reusable deterministic system-neutral seeded-random and dice-expression generator core.
      - Random 4d6 keep-highest-3 generation retaining raw dice, kept dice, roll slots, seed, and assignment provenance.
      - All twelve SRD 5.2.1 classes, all four backgrounds, and all nine species cataloged.
      - Reusable sticky acceptable-option choice-pool behavior with direct or random-from-checked selection.
      - Reusable sticky count-N acceptable-option behavior for multi-choice decisions.
      - Guided class-first creation using sticky Class, Background, and Species pools.
      - Standard Array, Point Cost, Random, and Manual routed through one guided native builder.
      - Creator workspace consolidated to generation controls left and character details right, with independent desktop scrolling and one dynamic ability-generation dropdown.
      - dnd5e-character/0.3 guided native state while preserving 0.1 and 0.2 reopen/validation semantics.
      - Explicit class skills, Fighter Fighting Style, class starting equipment, Weapon Mastery, Monk tool/instrument, Rogue Expertise/bonus language, origin languages, alignment, and Human size/Skillful/Versatile/Skilled choices.
      - Blank-name generation restored through shared D&D system-layer name generation plus explicit Name randomize action/provenance.
      - Descriptive starting-equipment presentation and compact generation-method help.
      - Guided species support for Dragonborn, Dwarf, Goliath, Halfling, Human, and Orc, including explicit Dragonborn and Goliath ancestry choices.
      - All four SRD backgrounds enabled: Acolyte, Criminal, Sage, Soldier.
      - D&D-native Magic Initiate spell-grant state for Acolyte and Sage with explicit casting ability, cantrips, Level 1 spell, free-cast resource, provenance, and independent validation.
      - First class-owned spellcasting state proven with Cleric Level 1, separate from independent spell grants.
      - Guided class support now includes Barbarian, Cleric, Fighter, Monk, and Rogue.
      - Cleric Divine Order, 3/4 cantrips, four prepared Level 1 spells, two Level 1 slots, Wisdom casting, Holy Symbol focus, Protector training, and Thaumaturge knowledge bonus retained natively and validated independently.
      - Cleric + Acolyte coexistence proves `spells.classCasting[]` and `spells.grants[]` remain separate source capabilities.
      - Legacy dnd5e-character/0.2 class validation isolated from the expanding current guided class union.
      - Automated-green Cleric checkpoint 80769e8854f4b9ee80e6fffa9e497115df5fda58, Actions 33128723547, 17 test files / 77 tests.
    current_gate:
      - Owner runtime QA previously found the creator direction broadly functional and requested a real magical class before the next meaningful test pass.
      - Cleric now supplies that first magical class and awaits owner runtime QA.
      - Current generation/guided work stays on dev and is not promoted until the accumulated pass is explicitly accepted.
    current_slice:
      - Continue issue #11 from the proven class-spellcasting primitive.
      - Choose the next consumer by reusable architecture and bounded implementation cost rather than catalog order.
      - Reuse `spells.classCasting[]` for another standard-slot class only where the source rules genuinely fit the common primitives.
      - Reuse `spells.grants[]` for Elf/Gnome/Tiefling or general Magic Initiate only where mechanically accurate.
      - Keep Wizard spellbook and Warlock Pact Magic source-specific rather than flattening them into Cleric semantics.
    remaining_scope:
      - Enable remaining classes Bard, Druid, Paladin, Ranger, Sorcerer, Warlock, and Wizard only after all Level 1 source decisions/mechanics are explicit.
      - Enable Elf, Gnome, and Tiefling only after lineage/legacy choices and spell grants are represented faithfully.
      - Add the Druid Magic Initiate list before enabling Human-selected Magic Initiate.
      - Replace the temporary six-name D&D list with a future structured naming architecture informed by culture/species/language consumers rather than a giant flat list.
      - Consolidate Quick Generate into the creator workspace as a top-level creation mode, not an ability method.
      - Add early guided narrative generation through the same catalogs and ordinary generation APIs.
      - Introduce a system-neutral random-table companion after concrete consumers define its output contract and before guided narrative creates parallel table machinery.
    tracking:
      guided_workspace_issue: 9
      core_choices_issue: 10
      full_srd_breadth_issue: 11
      workspace_qa_polish_issue: 12

  - id: companion-random-tables
    horizon: watch
    status: discovery_triggered_later
    goal: Provide reusable provenance-bearing random-table evaluation for character flavor and structured suggestions without patching native character state directly.
    trigger:
      - Backgrounds are open and additional class/species choice slices provide concrete consumers.
      - The table output contract can be derived from real needs such as traits, ideals, bonds, flaws, equipment/trinkets, tags, native IDs, or subtable references.
      - Start before guided narrative grows large enough to invent separate randomization infrastructure.
    guardrails:
      - Generic table engine remains system-neutral.
      - D&D datasets and mappings remain D&D-owned.
      - Table results feed ordinary generation decisions or structured suggestions and retain provenance.
      - Do not freeze a universal table schema from D&D flavor tables alone.

  - id: naming-system-watch
    horizon: watch
    status: discovery_triggered_later
    goal: Replace temporary flat generated-name lists with structured, provenance-bearing name generation that can eventually interoperate with Worldbuilding culture and language systems.
    current_state:
      - D&D currently chooses from six hardcoded full names using the shared seeded PRNG.
      - Explicit typed names override generation.
      - Blank-name generation reuses a generation seed when available or creates a separate name seed.
    guardrails:
      - Do not scale by merely adding hundreds of flat full-name strings.
      - Let concrete culture, species, language, gender/style, and setting needs define the eventual schema.
      - Retain deterministic/random provenance.
      - Keep system- or setting-specific datasets separate from a reusable generation mechanism.

