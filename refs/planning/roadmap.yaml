version: 1
updated: 2026-09-08
principles:
  - Ship small vertical slices and revise architecture from evidence.
  - Keep native system state lossless even while the semantic bridge evolves.
  - Add universal concepts only when concrete system mappings justify them.
  - Make guided narrative generation a first-class path early.
  - Keep sticky user choice preferences separate from authoritative character state and per-character provenance.
  - Keep generation controls in the creator workspace and character details in a persistent adjacent review surface rather than multiplying full-width method panels.
  - On desktop, long creator-control and character-review columns should scroll independently.
roadmap:
  - id: foundation-0-repository-baseline
    horizon: completed
    status: completed
    goal: Establish development workflow, durable guidance, validation, and the minimum character contract.
    exit_criteria:
      - dev, qa, and main branches exist with exact-SHA promotion guidance.
      - CI verifies dev, qa, and main.
      - CharacterDocument requires retained native system state.
      - Tests prove native payload survives JSON round trip without requiring semantic projection.
      - Translator and bridge-RPG evidence ledger exists and is required agent reading.
    validation:
      local_windows_gate: green 2026-08-26

  - id: dnd5e-1-level-one-generation
    horizon: now
    status: in_progress
    goal: Deliver a usable D&D 5E 2024 SRD Level 1 character generation path and broaden it to the public SRD catalog without losing native fidelity.
    completed:
      - Versioned rules-system adapter contract separated from D&D implementation.
      - SRD 5.2.1 source, version, creator, and CC-BY-4.0 license metadata.
      - Typed D&D-native character schemas with legacy reopen support.
      - Owner-accepted Human Soldier Fighter Quick Generate plus Parchment save/reopen seam.
      - Shared 2024 background adjustment and final-score behavior.
      - Standard Array, Manual Ability Entry, SRD Point Cost, and SRD Random Generation.
      - Reusable deterministic system-neutral seeded-random and dice-expression generator core.
      - Random 4d6 keep-highest-3 generation retaining raw dice, kept dice, roll slots, seed, and assignment provenance.
      - All twelve SRD 5.2.1 classes, all four backgrounds, and all nine species cataloged and guided-supported on dev.
      - Reusable sticky acceptable-option choice-pool behavior with direct or random-from-checked selection.
      - Direct dropdowns expose all supported options while acceptable pools constrain randomization only.
      - Reusable sticky count-N acceptable-option behavior for multi-choice decisions.
      - Guided class-first creation using sticky Class, Background, and Species pools.
      - Standard Array, Point Cost, Random, and Manual routed through one guided native builder.
      - Creator workspace consolidated to generation controls left and character details right, with independent desktop scrolling and one dynamic ability-generation dropdown.
      - dnd5e-character/0.3 guided native state while preserving 0.1 and 0.2 reopen/validation semantics.
      - Explicit class skills, Fighter Fighting Style, class starting equipment, Weapon Mastery, Monk tool/instrument, Rogue Expertise/bonus language, origin languages, alignment, and Human size/Skillful/Versatile/Skilled choices.
      - Blank-name generation restored through shared D&D system-layer name generation plus explicit Name randomize action/provenance.
      - Descriptive starting-equipment presentation and compact generation-method help.
      - Guided species support for all nine SRD species: Dragonborn, Dwarf, Elf, Gnome, Goliath, Halfling, Human, Orc, and Tiefling.
      - Dragonborn and Goliath retain explicit ancestry choices and ancestry-derived mechanical state.
      - Elf retains Drow/High/Wood lineage, Keen Senses, spellcasting ability, lineage Speed/Darkvision, Level 1 cantrip state, High Elf replacement semantics, and explicit future Level 3/5 spell grants.
      - Gnome retains Forest/Rock lineage, spellcasting ability, Forest Speak with Animals free-cast state, and Rock Gnome clockwork-device capacity.
      - Tiefling retains Small/Medium size, Abyssal/Chthonic/Infernal legacy, spellcasting ability, legacy resistance/cantrip state, Thaumaturgy, and explicit future Level 3/5 spell grants.
      - Species-owned magic retained separately in spells.speciesGrants with independent adapter validation and Pact of the Tome duplicate exclusion across class, feat, and species sources.
      - All four SRD backgrounds enabled: Acolyte, Criminal, Sage, Soldier.
      - D&D-native Magic Initiate spell-grant state for Acolyte and Sage with explicit casting ability, cantrips, Level 1 spell, free-cast resource, provenance, and independent validation.
      - Human Versatile supports selected Magic Initiate with Cleric/Druid/Wizard list, casting ability, two cantrips, one Level 1 spell, independent retained feat spell-grant state, provenance, reopen validation, and different-list enforcement when Magic Initiate is repeated.
      - Class-owned standard-slot spellcasting state proven separately from independent spell grants.
      - Guided class support expanded to all twelve SRD classes: Barbarian, Bard, Cleric, Druid, Fighter, Monk, Paladin, Ranger, Rogue, Sorcerer, Warlock, Wizard.
      - Cleric Divine Order, 3/4 cantrips, four prepared Level 1 spells, two Level 1 slots, Wisdom casting, Holy Symbol focus, Protector training, and Thaumaturge knowledge bonus retained natively and validated independently.
      - Druid Primal Order, Druidic language/focus, Herbalism Kit, Warden/Magician consequences, and class spellcasting retained natively.
      - Druid Speak with Animals retained as always prepared through Druidic and excluded from ordinary prepared choices.
      - Bard spellcasting, Bardic Inspiration, and three explicit musical instrument proficiency/focus choices retained and validated.
      - Paladin spellcasting, Lay on Hands, Martial/Heavy Armor training, and two Weapon Mastery choices retained and validated.
      - Ranger spellcasting, Favored Enemy, Hunter's Mark always-prepared/free-cast state, training, and two Weapon Mastery choices retained and validated.
      - Ranger Hunter's Mark excluded from the two ordinary prepared-spell choices.
      - Sorcerer spellcasting and Innate Sorcery resource state retained and validated.
      - Wizard six-spell Level 1 spellbook, four-spell prepared subset, Arcane Recovery, slots, and focus/spellbook capability retained and validated.
      - Wizard adapter validation rejects prepared spells outside the retained spellbook.
      - Warlock Pact Magic retained separately from ordinary Long-Rest slot semantics with one Level 1 slot restored on Short or Long Rest.
      - Warlock Level 1 retains two cantrips, two prepared Level 1 spells, Arcane Focus capability, training, and one explicit Eldritch Invocation.
      - Five genuinely Level-1-legal Warlock Invocations supported: Armor of Shadows, Eldritch Mind, Pact of the Blade, Pact of the Chain, Pact of the Tome.
      - Pact of the Tome retains three cantrips and two Level 1 ritual spells while excluding spells already prepared through Pact Magic, background Magic Initiate, Human Magic Initiate, or currently active species grants.
      - Pact of the Tome browser menus and sticky provenance use the same filtered legal option set rather than deferring duplicate detection to submit time.
      - Class spellcasting, species spell grants, and multiple legal independent Magic Initiate grants coexist as separate native source capabilities.
      - Legacy dnd5e-character/0.2 class validation isolated from the expanding current guided class union.
      - Visible Character Forge runtime build/source badge and Parchment local rebuild seam added for QA provenance.
      - Automated-green full SRD species checkpoint e8a0b1e778299a7ce0f4b2e6bfe1432c7cdd35cb, Actions 34215046544, 25 test files / 114 tests, including all 108 class/species combinations.
      - Automated-green mechanical SRD Level 1 closeout 55f79a1004c14eef1635e92c602e1fefa18cab15, Actions 34220401743, 25 test files / 117 tests, adapter 0.15.0.
    current_gate:
      - Mechanical SRD Level 1 breadth is complete on dev.
      - The user requested that the broad Level 1 expansion be tested as an accumulated runtime batch before promotion.
      - Current generation/guided work stays on dev and is not promoted until the accumulated pass is explicitly accepted.
    current_slice:
      - Complete owner batch QA across representative classes and all enabled species lineage or legacy paths.
      - Verify Human Criminal/Soldier Magic Initiate list, ability, spell, free-cast, and reopen behavior.
      - Verify Human Acolyte/Sage repeated Magic Initiate excludes the background list, retains two independent grants, and survives reopen.
      - Verify Warlock one-slot Short/Long-Rest Pact Magic semantics and all five Level 1 Invocations.
      - Verify Pact of the Tome excludes spells already prepared through Pact Magic, either Magic Initiate grant, or the selected species.
      - Verify Druid Speak with Animals and Ranger Hunter's Mark remain always-prepared source features rather than ordinary prepared choices.
      - Verify Wizard spellbook-to-prepared subset behavior survives Parchment save/reopen.
      - Verify Elf lineage Speed/Darkvision/spell state, Forest versus Rock Gnome state, and all three Tiefling legacy resistance/cantrip/future-grant paths survive generation and reopen.
    remaining_scope:
      - Replace the temporary six-name D&D list with a future structured naming architecture informed by culture/species/language consumers rather than a giant flat list.
      - Consolidate Quick Generate into the creator workspace as a top-level creation mode, not an ability method.
      - Add early guided narrative generation through the same catalogs and ordinary generation APIs.
      - Introduce the system-neutral random-table companion now that mechanical SRD Level 1 breadth is closed, using concrete personality/flavor consumers to define its output contract before implementation.
    tracking:
      guided_workspace_issue: 9
      core_choices_issue: 10
      full_srd_breadth_issue: 11
      workspace_qa_polish_issue: 12

  - id: system-6-second-stress-test
    horizon: now
    status: in_progress
    goal: Implement BRP Universal Game Engine as a structurally different second RPG and use implementation evidence to break D&D-shaped assumptions before expanding the shared semantic layer.
    selected_system: Basic Roleplaying Universal Game Engine
    rules_boundary: 2023 UGE ORC content with corrections 1.05
    tracking_issue: 13
    completed:
      - Candidate SWOT/matrix reviewed and BRP UGE accepted over branded Call of Cthulhu as the public second-system implementation target.
      - Architecture premortem completed without finding evidence that character-document/0.1 or the current RulesSystemAdapter contract requires a shared-schema change.
      - BRP UGE ORC source and corrections 1.05 boundary recorded with source ID chaosium-brp-uge-orc-1.05.
      - brp-character/0.1 native state introduced for a Normal-power, non-powered human profile.
      - Representative Detective profession retains profession identity, wealth, and four selected professional electives without treating profession as D&D class.
      - Explicit STR/CON/SIZ/INT/POW/DEX/CHA state retains initial/adjustment/final layers.
      - Core BRP derived values and corrected Charisma Roll semantics implemented.
      - Professional 250-point and personal INT x 10 skill budgets retained and validated separately.
      - Open specialty identity proven through Firearm (Handgun), Knowledge (Law), and Science (Forensics).
      - Independent adapter validation checks source/version/profile, profession eligibility, skill budgets, starting cap, causal skill math, characteristic rolls, derived values, and tampering.
      - CharacterDocument JSON round trip preserves the BRP native payload without semantic reconstruction.
      - Automated-green first BRP checkpoint da045ea71d9827ad756a706429399f2101f36498, Actions 34225597834, job 102058824469, 26 test files / 123 tests / 0 failures.
      - Standard rolled characteristic generation implemented with deterministic seeded 3d6 and 2d6+6 rolls using system-neutral generator-core primitives.
      - Raw characteristic dice, notation, modifiers, totals, seed, and pre-redistribution values are retained in BRP-native construction provenance.
      - Standard up-to-three-point characteristic redistribution is retained as explicit source/destination/amount transfers and matching source-aware characteristic adjustment layers.
      - Explicit and standard-rolled generation converge on the same brp-character/0.1 native ontology and shared downstream characteristic-roll, derived-value, and skill construction path.
      - Adapter 0.2.0 independently replays the retained seed, validates exact raw dice and redistribution causality, and preserves compatibility with first-slice explicit 0.1 payloads.
      - Automated-green rolled-characteristic checkpoint fab012deed4a0f795aee3d163112f7fafb357c7f, Actions 34230839209, job 102076260630, 27 test files / 129 tests / 0 failures, 12 BRP tests.
    current_slice:
      - Treat generation-method convergence as evidence that construction method can remain provenance rather than multiplying native ontologies.
      - Add Heroic as the second retained BRP power-level profile while keeping powers themselves disabled.
      - Parameterize professional skill budgets and starting caps from the retained power level instead of branching into separate Normal/Heroic builders.
      - Model or deliberately constrain Heroic age interaction so the source's age-based professional-skill adjustments are not silently ignored.
      - Preserve personal skill points at INT x 10 and keep Detective as the representative profession so the profile test is isolated.
      - Keep BRP creator UI deferred until profile-aware backend construction and validation are stable.
    guardrails:
      - Keep Call of Cthulhu-specific protected content out of the BRP adapter; branded Call of Cthulhu remains a separately licensed future product target.
      - Preserve BRP rules-profile context natively rather than inferring optional rules from final numbers.
      - Profession is not class; do not promote a universal class concept.
      - Preserve skill base chance, allocation contributions, and final rating separately when causality matters.
      - Keep specialties open-ended and source-owned rather than freezing a universal enum.
      - Do not model BRP powers through D&D spell-state structures.
      - Keep generation method provenance separate from runtime ontology unless source rules prove otherwise.
      - Do not change shared CharacterDocument or semantic contracts without concrete cross-system evidence.

  - id: companion-random-tables
    horizon: next
    status: ready_for_discovery
    goal: Provide reusable provenance-bearing random-table evaluation for character flavor and structured suggestions without patching native character state directly.
    trigger:
      - Mechanical SRD Level 1 breadth is automated-green, satisfying the prior closeout dependency.
      - Use concrete consumers such as traits, ideals, bonds, flaws, equipment/trinkets, tags, native IDs, weighted results, and subtable references to define the output contract.
      - Start before guided narrative grows large enough to invent separate randomization infrastructure.
    guardrails:
      - Generic table engine remains system-neutral.
      - D&D datasets and mappings remain D&D-owned.
      - Table results feed ordinary generation decisions or structured suggestions and retain provenance.
      - Deterministic seed and source/table provenance survive generation records.
      - Do not freeze a universal table schema from D&D flavor tables alone.
      - Add nesting or subtable mechanics only when a concrete consumer requires them.

  - id: naming-system-watch
    horizon: watch
    status: discovery_triggered_later
    goal: Replace temporary flat generated-name lists with structured, provenance-bearing name generation that can eventually interoperate with Worldbuilding culture and language systems.
    current_state:
      - D&D currently chooses from six hardcoded full names using the shared seeded PRNG.
      - Explicit typed names override generation.
      - Blank-name generation reuses a generation seed when available or creates a separate name seed.
    guardrails:
      - Do not scale by merely adding hundreds of flat full-name strings.
      - Let concrete culture, species, language, gender/style, and setting needs define the eventual schema.
      - Retain deterministic/random provenance.
      - Keep system- or setting-specific datasets separate from a reusable generation mechanism.

